<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Lazyframe Demo - Custom Title</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="stylesheet" href="/dist/lazyframe.css" />
        <link rel="stylesheet" href="assets/demo.css" />
    </head>
    <body>
        <h1><a href="index.html">@justia/lazyframe</a></h1>

        <div class="content">
            <h2><code>data-title</code></h2>
            <p class="text-center">
                This prevents the fetch call to
                <code>noembed.com</code>
                and sets the title with the provided text.
            </p>
        </div>

        <div class="samples">
            <div class="sample">
                <p><strong>YouTube</strong></p>
                <div
                    class="lazyframe"
                    data-src="https://www.youtube.com/embed/ara1uUvajoU"
                    data-vendor="youtube"
                    data-title="Consectetur ipsum laboris eiusmod fugiat laboris fugiat occaecat ex culpa excepteur laboris veniam."
                ></div>
            </div>
            <div class="sample">
                <p><strong>YouTube (nocookie)</strong></p>
                <div class="lazyframe" data-src="https://www.youtube-nocookie.com/embed/EO9inlOjZGg?rel=0" data-vendor="youtube_nocookie" data-title="Aliqua nulla nulla aliquip aliqua eu ex."></div>
            </div>
            <div class="sample">
                <p><strong>Vimeo</strong></p>
                <div
                    class="lazyframe"
                    data-src="https://vimeo.com/111049676"
                    data-vendor="vimeo"
                    data-title="Consequat id nulla fugiat sint pariatur enim laboris consectetur officia reprehenderit cillum ipsum."
                ></div>
            </div>
        </div>

        <script src="/dist/lazyframe.min.js"></script>
        <script>
            lazyframe('.lazyframe');
        </script>
    </body>
</html>
